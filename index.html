<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      window.onerror = function(msg, url, line) {
        console.error("Runtime error:", msg, "at line:", line, "url:", url);
      };
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Professional-grade piano practice assistant with real-time MIDI notation and timing analytics." />
    <meta property="og:title" content="Piano Trainer Pro" />
    <meta property="og:description" content="Professional-grade piano practice assistant with real-time MIDI notation and timing analytics." />
    
    <!-- PWA / iOS Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PianoPro" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3221/3221764.png" />
    <link rel="manifest" href="manifest.json" />

    <title>Piano Trainer Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.8.0/dist/alphaTab.min.js" crossorigin="anonymous"></script>
    <style>
      body {
        background-color: #000;
        touch-action: manipulation;
        margin: 0;
        padding: 0;
        height: 100vh;
        overflow: hidden; /* Prevent body scroll, handle in App */
        padding-top: env(safe-area-inset-top);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
      }
      .no-select {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      .alphaTab-container {
        background: transparent !important;
      }
      .alphaTab-container svg {
        width: 100% !important;
        height: auto !important;
        display: block;
      }
      
      .alphaTab-container svg .note path,
      .alphaTab-container svg .note rect,
      .alphaTab-container svg .note use {
        transition: fill 0.3s ease, stroke 0.3s ease;
      }

      /* Custom Scrollbars */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
      ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
  <body class="text-slate-100 font-sans no-select">
    <div id="root" style="height: 100%; overflow: hidden;"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
